name: Android source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check host policies and publication boundaries
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          python3 --version
          python3 tools/verify_github_ready.py
